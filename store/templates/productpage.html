{% extends "base.html" %}{% block content %}
<main class="product-page">
  <div
    id="carouselExampleIndicators"
    class="carousel slide product-carousel"
    data-ride="carousel"
  >
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img
          class="d-block product-image"
          src="/static/assets/images/{{ data[2] }}/1.png"
          alt="First slide"
        />
      </div>
      <div class="carousel-item">
        <img
          class="d-block product-image"
          src="/static/assets/images/{{ data[2] }}/2.png"
          alt="Second slide"
        />
      </div>
      <div class="carousel-item">
        <img
          class="d-block product-image"
          src="/static/assets/images/{{ data[2] }}/3.png"
          alt="Third slide"
        />
      </div>
      <div class="carousel-item">
        <img
          class="d-block product-image"
          src="/static/assets/images/{{ data[2] }}/4.png"
          alt="Fourth slide"
        />
      </div>
      <div class="carousel-item">
        <img
          class="d-block product-image"
          src="/static/assets/images/{{ data[2] }}/5.png"
          alt="Fifth slide"
        />
      </div>
    </div>
    <a
      class="carousel-control-prev carousel_control"
      href="#carouselExampleIndicators"
      role="button"
      data-slide="prev"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a
      class="carousel-control-next carousel_control"
      href="#carouselExampleIndicators"
      role="button"
      data-slide="next"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>
  <section class="product-details">
    <h1>{{data[0]}} - £{{data[1]}}</h1>
    <form class="product-form" action="/basket/{{data[2]}}" method="POST">
      <a class="sizechart" href="blahblahblah">See Size Chart</a>
      <div class="quantity">
        <h4>Size:</h4>
        <select
          class="form-select"
          value="{{request.form.size}}"
          aria-label="Default select example"
          name="size"
        >
          <option value="Small">Extra Small</option>
          <option value="Small">Small</option>
          <option value="Medium">Medium</option>
          <option selected value="Large">Large</option>
          <option value="Extra Large">Extra Large</option>
          <option value="Small">2XL</option>
          <option value="Medium">3XL</option>
        </select>
      </div>
      <div class="quantity">
        <h4>Quantity:</h4>
        <select
          class="form-select"
          value="{{request.form.quantity}}"
          aria-label="Default select example"
          name="quantity"
        >
          <option selected value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
        <button class="btn btn-primary" type="submit">Add to Basket</button>
      </div>
    </form>
  </section>
</main>
{% endblock %}
